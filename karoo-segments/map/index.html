<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Karoo segments — szuter & asfalt</title>
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <aside id="sidebar">
    <header>
      <h1>Karoo segments</h1>
      <p class="subtitle">Twoja mapa szutrów &amp; asfaltów</p>
    </header>

    <section class="toolbar">
      <label class="btn primary">
        <input type="file" id="fit-input" accept=".fit" hidden />
        Wczytaj .fit
      </label>
      <button id="draw-btn" class="btn">Rysuj segment</button>
      <button id="export-btn" class="btn">Eksport .geojson</button>
      <label class="btn ghost">
        <input type="file" id="geojson-input" accept=".geojson,.json" hidden />
        Import .geojson
      </label>
    </section>

    <section class="filters">
      <strong>Pokaż:</strong>
      <label><input type="checkbox" data-filter-kind="gravel" checked /> szuter</label>
      <label><input type="checkbox" data-filter-kind="asphalt" checked /> asfalt</label>
      <br />
      <label><input type="checkbox" data-filter-tier="a" checked /> A</label>
      <label><input type="checkbox" data-filter-tier="b" checked /> B</label>
      <label><input type="checkbox" data-filter-tier="c" checked /> C</label>
    </section>

    <section class="segments-list">
      <h2>Segmenty (<span id="seg-count">0</span>)</h2>
      <ul id="seg-list"></ul>
    </section>

    <footer>
      <p>Dane: <code>localStorage</code>. Eksportuj regularnie do .geojson.</p>
    </footer>
  </aside>

  <main>
    <div id="map"></div>

    <div id="draw-banner" class="banner hidden">
      <span id="draw-banner-text">Rysowanie segmentu…</span>
      <button id="draw-finish" class="btn small">Zakończ (lub dbl-klik)</button>
      <button id="draw-cancel" class="btn small ghost">Anuluj</button>
    </div>

    <div id="import-banner" class="banner hidden">
      <span id="import-banner-text">Import FIT…</span>
      <button id="import-close" class="btn small ghost">Zamknij podgląd</button>
    </div>
  </main>

  <!-- Modal -->
  <div id="modal-backdrop" class="hidden">
    <div id="modal">
      <h3 id="modal-title">Zapisz segment</h3>
      <div id="modal-body"></div>
      <div id="modal-actions"></div>
    </div>
  </div>

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>
  <script src="https://cdn.jsdelivr.net/npm/fit-file-parser@1.18.4/dist/fit-parser.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
